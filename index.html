const lessons={
"QA|Percentages":{
title:"Percentages — Zero to CAT",
intro:"Percentage is a way to express a quantity as a fraction of 100. CAT uses it inside arithmetic, DI, profit-loss, mixtures, averages and many word problems.",
sections:[
["1. Definition","A percentage tells us 'how much out of 100'. 20% means 20 out of 100, so 20% = 20/100 = 1/5."],
["2. Core conversion","Fraction → percentage: multiply by 100. Percentage → fraction: divide by 100. Decimal → percentage: multiply by 100."],
["3. Percentage of a number","To find x% of N, calculate (x/100)×N. Example: 18% of 250 = 18×2.5 = 45."],
["4. Increase / decrease","If a value P increases by r%, new value = P(1+r/100). If it decreases by r%, new value = P(1-r/100)."],
["5. Successive changes","For changes a% and b%, net percentage change = a+b+ab/100 when both are increases; use signs for decreases. Example: +20%, then -20% gives 20-20-4 = -4%."],
["6. Reverse percentage","If final value after a 25% increase is 500, original = 500/1.25 = 400. Do not subtract 25% from the final value."],
["7. Percentage points vs percent","A rise from 40% to 50% is +10 percentage points, but relative increase is 25%."],
["8. CAT connection","Percentages are often hidden inside profit-loss, population, salaries, DI and mixtures. Train yourself to identify the base quantity first."]
],
examples:[
["Example 1","A shirt priced ₹800 is discounted by 15%. Discount = 120, so selling price = ₹680."],
["Example 2","A number increases from 240 to 300. Increase = 60. Percentage increase = 60/240×100 = 25%."],
["Example 3","After a 20% decrease, a price becomes ₹640. Original = 640/0.8 = ₹800."]
],
formula:["x% of N = xN/100","New after r% increase = Old × (100+r)/100","New after r% decrease = Old × (100-r)/100","Two successive changes a%, b%: net = a+b+ab/100 (use signed a,b)"],
tips:["Always ask: 'percentage of what?' The denominator is the base.","For 10%, 5%, 1% calculate mentally whenever possible.","For reverse percentage, divide by the multiplier instead of reversing the operation."],
mistakes:["Treating +20% and -20% as zero change.","Using the final value as denominator when calculating percentage increase.","Confusing percentage points with percentage change."]
],
"QA|Averages":{
title:"Averages — Zero to CAT",intro:"An average is a central value. For equal weights it is total divided by number of observations.",
sections:[
["1. Definition","Average = Sum of observations ÷ Number of observations."],
["2. Reverse thinking","If average of 8 numbers is 25, total is 8×25 = 200."],
["3. Combined average","When groups have different sizes, total both groups and divide by total people. Do not simply average the two averages unless group sizes are equal."],
["4. Replacement","If one value x is replaced by y, change in average = (y-x)/n."],
["5. Weighted average","If quantities have weights, average = Σ(weight×value)/Σweight."],
["6. CAT connection","Averages combine naturally with mixtures, DI, salaries, marks, ages and replacement questions."]
],
examples:[
["Example 1","Average of 6 numbers is 18. Their sum is 108."],
["Example 2","Average of 10 students is 60. One student scoring 75 replaces one scoring 55. New average = 60+(20/10)=62."],
["Example 3","Group A: 20 people average 30; Group B: 30 people average 40. Combined average = (600+1200)/50 = 36."]
],
formula:["Average = Sum/n","Sum = Average×n","Replacement change = (new−old)/n","Combined average = (n1a1+n2a2)/(n1+n2)"],
tips:["Convert average questions into total-sum questions early.","Averages are weighted by group size."],
mistakes:["Taking the average of two averages when group sizes differ.","Forgetting the denominator after a replacement."]
],
"QA|Ratio & Proportion":{
title:"Ratio & Proportion — Zero to CAT",intro:"A ratio compares quantities using the same unit. Proportion says two ratios are equal.",
sections:[
["1. Ratio","a:b means a/b. If boys:girls = 3:2, there are 5 equal parts in total."],
["2. Scaling","3:2 is the same ratio as 6:4 or 30:20."],
["3. Division in a ratio","To divide ₹500 in 3:2, total parts = 5. One part = ₹100, so shares are ₹300 and ₹200."],
["4. Proportion","a:b = c:d means ad = bc."],
["5. Direct variation","If y is directly proportional to x, y/x is constant."],
["6. Inverse variation","If y is inversely proportional to x, xy is constant."],
["7. CAT connection","Ratios appear in mixtures, work, speed, geometry, DI and partnership."]
],
examples:[
["Example 1","A:B=4:7 and total is 55. Total parts=11, one part=5. A=20, B=35."],
["Example 2","If x:y=2:3 and y:z=4:5, make y common: x:y=8:12 and y:z=12:15, so x:y:z=8:12:15."]
],
formula:["a:b = a/b","If a:b=m:n and total=T, shares = mT/(m+n), nT/(m+n)","Direct: y/x = constant","Inverse: xy = constant"],
tips:["Always make units consistent before forming a ratio.","When two ratios share a term, equalise that term first."],
mistakes:["Adding ratios without a common basis.","Forgetting that ratio is unit-sensitive."]
],
"QA|Profit & Loss":{
title:"Profit & Loss — Zero to CAT",intro:"Profit or loss compares selling price with cost price. CAT frequently combines this with discounts and successive changes.",
sections:[
["1. Definitions","CP = cost price. SP = selling price. Profit = SP−CP. Loss = CP−SP."],
["2. Percentages","Profit% = Profit/CP×100. Loss% = Loss/CP×100."],
["3. Discount","Discount = Marked Price−Selling Price. Discount% is usually calculated on marked price."],
["4. Successive discounts","Discounts are multiplicative, not simply additive. Two discounts a% and b% give net discount a+b−ab/100."],
["5. Reverse problems","If profit is 25%, SP = 1.25×CP. If SP is known, divide by 1.25 to recover CP."],
["6. CAT connection","Watch the denominator: profit/loss percentage uses CP; discount percentage uses MP."]
],
examples:[
["Example 1","CP ₹400, SP ₹460. Profit ₹60 = 15% of CP."],
["Example 2","MP ₹1000, discounts 20% and 10%. Final price = 1000×0.8×0.9 = ₹720, so net discount = 28%."],
["Example 3","A seller gains 20% by selling at ₹600. CP = 600/1.2 = ₹500."]
],
formula:["Profit% = (SP−CP)/CP×100","Loss% = (CP−SP)/CP×100","SP after discount d% = MP(1−d/100)","Net successive discount = a+b−ab/100"],
tips:["Write CP/MP/SP labels before calculating.","For reverse questions, use multipliers."],
mistakes:["Calculating profit% on SP.","Adding successive discounts directly."]
],
"QA|Number System":{
title:"Number System — Zero to CAT",intro:"Number System is the foundation for divisibility, remainders, factors, HCF/LCM and many integer questions.",
sections:[
["1. Number types","Natural numbers: 1,2,3,... Integers include zero and negatives. Rational numbers can be written p/q with q≠0."],
["2. Prime numbers","A prime has exactly two positive divisors: 1 and itself."],
["3. Divisibility","Useful tests: 2→last digit even; 3→digit sum divisible by 3; 5→last digit 0/5; 9→digit sum divisible by 9; 11→alternating digit sum divisible by 11."],
["4. Factors","If N = p^a q^b, number of positive divisors = (a+1)(b+1)."],
["5. HCF and LCM","For two positive integers a,b: a×b = HCF(a,b)×LCM(a,b)."],
["6. Remainders","If N is divided by d, N = dq+r where 0≤r<d. Modular arithmetic helps track remainders without expanding huge numbers."],
["7. CAT connection","Factorisation, cyclicity, units digit and remainder patterns are common tools."]
],
examples:[
["Example 1","360 = 2^3×3^2×5. Number of divisors = 4×3×2 = 24."],
["Example 2","Remainder of 17 when divided by 5 is 2, because 17=5×3+2."],
["Example 3","For powers of 2, units digits cycle 2,4,8,6. Cycle length is 4."]
],
formula:["N=p1^a1 p2^a2... ⇒ divisors=(a1+1)(a2+1)...","a×b=HCF×LCM (positive integers)","N=dq+r, 0≤r<d"],
tips:["Factor numbers instead of listing divisors.","Look for cycles in last-digit and remainder questions."],
mistakes:["Calling 1 a prime.","Allowing remainder equal to divisor.","Mixing HCF and LCM logic."]
],
"QA|Time Speed Distance":{
title:"Time, Speed & Distance — Zero to CAT",intro:"Distance, speed and time are linked by one basic relation. Most CAT questions become easier when you choose a consistent unit.",
sections:[
["1. Core relation","Distance = Speed×Time. Hence Speed = Distance/Time and Time = Distance/Speed."],
["2. Unit conversion","1 m/s = 18/5 km/h and 1 km/h = 5/18 m/s."],
["3. Relative speed","Same direction: difference of speeds. Opposite direction: sum of speeds."],
["4. Trains","Time to cross a point = train length/speed. To cross a platform = (train+platform length)/speed."],
["5. Boats","Downstream speed = boat speed + stream speed. Upstream = boat speed − stream speed."],
["6. CAT connection","Translate every statement into distance/time equations before solving."]
],
examples:[
["Example 1","At 60 km/h, a car covers 150 km in 2.5 hours."],
["Example 2","Two people move opposite ways at 5 and 7 m/s. Relative speed = 12 m/s."],
["Example 3","A 180 m train at 15 m/s crosses a pole in 12 seconds."]
],
formula:["D=ST","Relative speed: opposite = S1+S2; same = |S1−S2|","1 km/h=5/18 m/s"],
tips:["Keep all distances and speeds in compatible units.","Draw a small timeline for meeting/catching problems."],
mistakes:["Adding same-direction speeds.","Forgetting to convert hours/minutes/seconds."]
],
"QA|Time & Work":{
title:"Time & Work — Zero to CAT",intro:"Work questions are rate questions. If a person completes a job in n days, their one-day work rate is 1/n.",
sections:[
["1. Work rate","If A takes 10 days, A's rate = 1/10 job/day."],
["2. Combined work","If A and B work together, rates add: 1/a + 1/b."],
["3. Efficiency","If A is twice as efficient as B, A's rate is twice B's rate; A takes half the time."],
["4. Pipes","Filling pipes have positive rates; emptying pipes have negative rates."],
["5. LCM method","For integer-friendly problems, assume total work as LCM of individual days, then use units/day."],
["6. CAT connection","Translate 'days' into rates before combining people."]
],
examples:[
["Example 1","A takes 6 days, B takes 3 days. Together rate = 1/6+1/3=1/2, so 2 days."],
["Example 2","A is 50% more efficient than B. If B takes 12 days, A's time = 12/1.5 = 8 days."]
],
formula:["Rate=1/time","Combined rate=Σ rates","Time=Work/Rate"],
tips:["Rates add; times generally do not.","Use LCM when numbers are awkward."],
mistakes:["Adding completion times instead of rates.","Confusing efficiency with time."]
],
"QA|Algebra Basics":{
title:"Algebra Basics — Zero to CAT",intro:"Algebra uses symbols to represent unknown quantities. The goal is to translate relationships into equations and manipulate them without changing equality.",
sections:[
["1. Like terms","3x+5x=8x; x and x² are not like terms."],
["2. Identities","(a+b)²=a²+2ab+b²; (a−b)²=a²−2ab+b²; a²−b²=(a−b)(a+b)."],
["3. Linear equations","Do the same operation to both sides. Example: 3x+5=20 ⇒ x=5."],
["4. Factorisation","Look for common factors and standard identities before expanding."],
["5. Inequalities","Multiplying/dividing an inequality by a negative reverses the sign."],
["6. CAT connection","Algebra is used inside arithmetic, functions, geometry and DI."]
],
examples:[
["Example 1","2(x+3)=14 ⇒ x+3=7 ⇒ x=4."],
["Example 2","x²−9=(x−3)(x+3)."],
["Example 3","−2x>6 ⇒ x<−3 because division by a negative reverses the sign."]
],
formula:["(a+b)²=a²+2ab+b²","(a−b)²=a²−2ab+b²","a²−b²=(a−b)(a+b)"],
tips:["Simplify before expanding.","Check solutions by substituting them back."],
mistakes:["Losing a negative sign.","Not reversing inequality after division by a negative."]
],
"QA|Geometry Basics":{
title:"Geometry Basics — Zero to CAT",intro:"Geometry becomes manageable when you know angle relationships, triangle properties and area formulas.",
sections:[
["1. Lines & angles","Straight line = 180°. Around a point = 360°. Vertically opposite angles are equal."],
["2. Parallel lines","With parallel lines, corresponding and alternate interior angles are equal."],
["3. Triangle","Interior angles sum to 180°. Exterior angle equals sum of the two opposite interior angles."],
["4. Similarity","Similar triangles have equal corresponding angles and proportional corresponding sides."],
["5. Area","Triangle = 1/2×base×height; rectangle = length×breadth; circle = πr²."],
["6. CAT connection","Most geometry questions are theorem-recognition plus algebra."]
],
examples:[
["Example 1","Triangle angles 50° and 60° imply third angle 70°."],
["Example 2","Two similar triangles have side ratio 2:3; area ratio is 4:9."],
["Example 3","Circle radius 7 cm has area 49π cm²."]
],
formula:["Triangle angles sum=180°","Area triangle=1/2 bh","Area circle=πr²","Similar figures: area ratio=(side ratio)²"],
tips:["Draw a clean diagram.","Write known angles and lengths on the diagram."],
mistakes:["Assuming a diagram is to scale.","Using diameter where radius is required."]
],
"VARC|Reading Comprehension":{
title:"Reading Comprehension — Zero to CAT",intro:"RC tests your ability to understand an author's argument, identify evidence, infer what follows and eliminate unsupported choices.",
sections:[
["1. Read for structure","Track topic → claim → support → contrast → conclusion. You do not need to memorise every sentence."],
["2. Main idea","Ask: what is the passage mainly trying to establish? Avoid an option that is only one example or too broad."],
["3. Inference","An inference must be supported by the passage. It is not the same as what sounds generally true."],
["4. Tone","Describe the author's attitude using evidence: skeptical, analytical, critical, appreciative, neutral, etc."],
["5. Elimination","Reject options that are extreme, irrelevant, contradicted, outside the passage or distort the author's claim."],
["6. Time strategy","Start with comprehension, not speed. Improve speed gradually while preserving accuracy."]
],
examples:[
["Example","If a passage says a policy produced short-term gains but created long-term costs, an answer saying 'the policy had no benefits at all' is too extreme."],
["Inference example","If the author repeatedly contrasts popular belief with research evidence, the tone may be skeptical toward the popular belief."]
],
formula:["RC accuracy = correct answers / attempted answers × 100"],
tips:["Use the passage as the evidence source.","For inference questions, demand a logical bridge from text to option."],
mistakes:["Using outside knowledge.","Choosing an option because it sounds sophisticated.","Confusing author's mention of an idea with author's agreement."]
],
"VARC|Para Jumbles":{
title:"Para Jumbles — Zero to CAT",intro:"Para jumbles ask you to arrange sentences into a coherent paragraph. Look for openings, mandatory pairs and logical transitions.",
sections:[
["1. Find the opener","An opening sentence usually introduces the topic without depending on an earlier sentence via words like 'this', 'such', 'they'."],
["2. Mandatory pairs","Pronouns, definitions, examples and cause-effect links often create fixed relationships."],
["3. Connectors","However, therefore, for example, meanwhile and similarly signal logical relationships."],
["4. Chronology","Historical/process passages often follow time order."],
["5. General → specific","A broad claim is often followed by explanation, example or evidence."],
["6. CAT strategy","Build small chains instead of trying every permutation."]
],
examples:[
["Example","A: 'The city introduced a new bus network.' B: 'This network reduced average waiting time.' The pronoun 'This network' strongly points to A→B."],
["Connector","A sentence beginning 'However' generally needs a previous idea to contrast with."]
],
formula:["Useful chain types: claim→reason; concept→example; cause→effect; general→specific"],
tips:["Do not rely only on vocabulary; use logic.","Check the completed paragraph from start to end."],
mistakes:["Forcing an order because two sentences sound similar.","Ignoring pronoun/reference links."]
],
"DILR|Tables & Data":{
title:"Tables & Data Interpretation — Zero to CAT",intro:"DI is often less about difficult arithmetic and more about organising data correctly and choosing the right calculation.",
sections:[
["1. Read before calculating","Identify rows, columns, units, totals and what each number represents."],
["2. Build relationships","Convert raw data into percentages, ratios, differences or averages only when the question needs them."],
["3. Approximation","When answer choices are far apart, estimate to save time. Do not approximate when options are close."],
["4. Cross-check","A quick total or percentage sanity check can catch transcription errors."],
["5. CAT connection","DI sets frequently combine multiple small concepts rather than testing one formula."]
],
examples:[
["Example","If sales are 240, 300 and 360, growth from first to third = 120/240 = 50%, not 40%."],
["Ratio example","If A:B=2:3 and total is 500, A=200 and B=300."]
],
formula:["Percentage change=(new−old)/old×100","Average=sum/n"],
tips:["Underline units and years.","Write only the quantities you actually need."],
mistakes:["Using wrong denominator.","Mixing monthly and yearly units.","Reading a row as a column."]
],
"DILR|Arrangements":{
title:"Arrangements — Zero to CAT",intro:"Arrangement sets become easier when you convert verbal constraints into positions, blocks and exclusions.",
sections:[
["1. Linear arrangement","For n positions, start by identifying fixed positions and strongest constraints."],
["2. Blocks","If A must sit next to B, treat AB as a block initially, then place the block."],
["3. Relative order","Statements like A is left of B are directional constraints, not necessarily adjacent."],
["4. Circular arrangement","Fix one person when rotations are equivalent, then arrange relative positions."],
["5. CAT strategy","Do not branch blindly. Place the most constrained entity first."]
],
examples:[
["Example","If A must be immediately before B, consider 'AB' as one unit. If there are 5 other units, count arrangements at the unit level before expanding."],
["Constraint","If C cannot be at either end, remove the two end positions before placing C."]
],
formula:["Linear arrangements of n distinct items: n!","Circular arrangements (rotations same): (n−1)!"],
tips:["Draw slots.","Mark impossible positions with ×."],
mistakes:["Treating 'left of' as 'immediately left'.","Forgetting that a circular rotation may be identical."]
],
"DILR|Games & Tournaments":{
title:"Games & Tournaments — Zero to CAT",intro:"Tournament sets combine arithmetic with logical constraints. Build a points table before solving.",
sections:[
["1. Table first","Create rows for teams/players and columns for games, wins, draws, losses and points."],
["2. Translate scoring","Write the scoring rule explicitly before making deductions."],
["3. Total games","For a single round-robin with n teams, number of games = n(n−1)/2."],
["4. Constraints","Use totals, rankings and remaining games to eliminate possibilities."],
["5. CAT strategy","Separate certain facts from possible cases."]
],
examples:[
["Example","For 6 teams in a single round-robin, games = 6×5/2 = 15."],
["Logic","If Team A has already played all but one game, its remaining points may be bounded by the final game's result."]
],
formula:["Single round-robin games=n(n−1)/2"],
tips:["Maintain a clean table.","Track games played and games remaining."],
mistakes:["Double-counting matches.","Assuming a result not stated by the set."]
]
};

const practice={
"QA|Percentages":[
["A price rises from 400 to 460. Percentage increase?","15%","Increase=60; 60/400×100=15%."],
["A number after a 20% decrease is 360. Original?","450","360/0.8=450."],
["A quantity increases 10% and then 20%. Net increase?","32%","10+20+10×20/100=32%."]
],
"QA|Averages":[
["Average of 8 numbers is 17. Sum?","136","17×8=136."],
["Average of 10 is 50. Replace 30 with 70. New average?","54","Increase in total 40; average rises 4."],
["Groups 10 and 20 have averages 40 and 55. Combined average?","50","(400+1100)/30=50."]
],
"QA|Profit & Loss":[
["CP=500, SP=575. Profit%?","15%","75/500×100=15%."],
["Two discounts 20% and 10%. Net discount?","28%","20+10−2=28%."],
["SP=720 at 20% profit. CP?","600","720/1.2=600."]
],
"QA|Number System":[

["Remainder when 29 is divided by 6?","5","29=6×4+5."],
["Units digit cycle of powers of 2?","2,4,8,6","Cycle length 4."]
],
"QA|Time Speed Distance":[
["A car covers 180 km at 60 km/h. Time?","3 hours","180/60=3."],
["Speeds 8 and 5 m/s, opposite directions. Relative speed?","13 m/s","Add opposite-direction speeds."],
["A 150m train at 10m/s crosses a pole. Time?","15 s","150/10=15."]
],
"QA|Time & Work":[

["A=6 days, B=3 days. Together?","2 days","1/6+1/3=1/2."],
["B is twice as efficient as A. A takes 12 days. B?","6 days","Double efficiency means half time."]
],
"QA|Algebra Basics":[
["Solve 3x+4=19.","5","3x=15, x=5."],
["Factor x²−25.","(x−5)(x+5)","Difference of squares."],
["Solve −3x>12.","x<−4","Divide by negative and reverse sign."]
],
"QA|Geometry Basics":[
["Two triangle angles are 40° and 65°. Third?","75°","180−105=75."],
["Area of triangle b=10,h=8?","40","1/2×10×8=40."],
["Similar triangles side ratio 2:5. Area ratio?","4:25","Square the side ratio."]
],
"VARC|Reading Comprehension":[
["An option introduces information not present in the passage. Keep it?","No","RC answers must be supported by the passage."],
["A statement says a policy had benefits but also long-term costs. 'It had no benefits' is what type of error?","Too extreme","It contradicts the stated balance."]
],
"DILR|Tables & Data":[
["Values 100→125. Percentage increase?","25%","25/100×100=25%."],
["If A:B=3:5 and total=64, A?","24","3/8×64=24."]
],
"DILR|Games & Tournaments":[

function esc(s){return s.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function allKeys(){return Object.keys(syllabus).flatMap(sec=>syllabus[sec].map(x=>sec+"|"+x[0]))}
function pct(){let keys=allKeys();let d=keys.filter(k=>state.done[k]).length;return Math.round(d/keys.length*100)}
function setNav(active){document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("active",b.dataset.v===active))}
function topicList(sec,filter=""){
let arr=syllabus[sec].filter(x=>(x[0]+" "+x[1]).toLowerCase().includes(filter.toLowerCase()));
return arr.map(x=>{let k=sec+"|"+x[0], done=!!state.done[k];return `<div class="card topic"><div><input class="check" type="checkbox" ${done?"checked":""} onchange="toggleDone('${k.replace(/'/g,"\\'")}')"> <strong>${esc(x[0])}</strong><div class="muted small">${esc(x[1])}</div></div><button onclick="openLesson('${k.replace(/'/g,"\\'")}')">Study →</button></div>`}).join("")||`<div class="card muted">No matching topics.</div>`;
}
function dashboard(){
return `<div class="hero"><h1>CAT Master — Zero to CAT</h1><p>A teacher-style preparation system: learn the concept, see examples, practise, test yourself and analyse mistakes.</p></div>
<div class="grid">
<div class="card"><div class="muted">Overall topic progress</div><div class="big">${pct()}%</div><div class="progress"><i style="width:${pct()}%"></i></div></div>
<div class="card"><div class="muted">Topics completed</div><div class="big">${allKeys().filter(k=>state.done[k]).length}/${allKeys().length}</div><div class="muted small">Saved on this device</div></div>
<div class="card"><div class="muted">Mistake book</div><div class="big">${state.mistakes.length}</div><div class="muted small">Questions saved for revision</div></div>
</div>
<div class="grid2" style="margin-top:12px">
${["QA","DILR","VARC"].map(s=>{let keys=syllabus[s].map(x=>s+"|"+x[0]),d=keys.filter(k=>state.done[k]).length,p=Math.round(d/keys.length*100);return `<div class="card"><h3>${s==="QA"?"Quantitative Aptitude":s==="DILR"?"Data Interpretation & Logical Reasoning":"Verbal Ability & Reading Comprehension"}</h3><div class="muted">${d}/${keys.length} topics complete</div><div class="progress" style="margin-top:9px"><i style="width:${p}%"></i></div><button class="toolbar primary" style="margin-top:12px" onclick="go('${s}')">Open ${s} →</button></div>`}).join("")}
</div>
<div class="card" style="margin-top:12px"><h2>How to use this website</h2><ol><li>Open a topic and read the lesson from top to bottom.</li><li>Do the worked examples yourself before reading the solution.</li><li>Attempt practice without looking at the answer.</li><li>Mark the topic complete only when you can solve basic questions without help.</li><li>Record mistakes and revisit weak topics before mocks.</li></ol></div>`;
}
function sectionView(sec){
return `<div class="hero"><h1>${sec==="QA"?"Quantitative Aptitude":sec==="DILR"?"DILR":"VARC"}</h1><p>Study in order. Every topic has a lesson page, examples and practice where available.</p></div>
<input class="search" placeholder="Search topics..." oninput="document.getElementById('topics').innerHTML=topicList('${sec}',this.value)">
<div id="topics" style="margin-top:12px">${topicList(sec)}</div>`;
}
function openLesson(k){
let l=lessons[k];
if(!l){l={title:k.split("|")[1]+" — Guided Study",intro:"This topic is in the full syllabus. Use the concept map below as your study checklist, then practise the set.",sections:[["Definition","Start by writing a one-line definition in your own words."],["Core concepts","Break the topic into 3–5 rules or relationships. Learn one at a time."],["Worked example","Take a simple numerical/example problem and solve it step by step."],["CAT application","Identify how the concept can appear inside a mixed CAT set."],["Practice plan","Do 5 basic, 5 medium and 5 CAT-level questions before marking it complete."]],examples:[["Self-check","Explain the concept aloud without looking at notes. If you cannot, revisit the definition and example."]],formula:["Write the formulas/rules for this topic in your own short-note page."],tips:["Do not memorise a formula without understanding what each symbol means.","Use timed practice only after accuracy is stable."],mistakes:["Do not mark a topic complete just because you read it once."]}}
let ksafe=k.replace(/'/g,"\\'");
return `<div class="toolbar"><button onclick="go('${k.split("|")[0]}')">← Back to ${k.split("|")[0]}</button><button class="primary" onclick="toggleDone('${ksafe}')">${state.done[k]?"✓ Completed":"Mark Complete"}</button><button onclick="addToMistakes('${ksafe}')">⚠ Add to Mistake Book</button></div>
<article class="lesson"><h2>${esc(l.title)}</h2><p class="muted">${esc(l.intro)}</p>
${l.sections.map(s=>`<h3>${esc(s[0])}</h3><p>${esc(s[1])}</p>`).join("")}
<h3>Worked examples</h3>${l.examples.map(e=>`<div class="example"><strong>${esc(e[0])}</strong><div>${esc(e[1])}</div></div>`).join("")}
<h3>Formula / rule box</h3><div class="formula">${l.formula.map(x=>esc(x)).join("\\n")}</div>
<h3>Smart tips</h3><div class="tip">${l.tips.map(x=>`• ${esc(x)}<br>`).join("")}</div>
<h3>Common mistakes</h3><div class="mistake">${l.mistakes.map(x=>`• ${esc(x)}<br>`).join("")}</div>
</article>
${practice[k]?practiceView(k):`<div class="card" style="margin-top:12px"><h3>Practice is next</h3><p class="muted">This topic is mapped into the syllabus. Continue with the lesson, create your own 5-question drill, then use the Test section.</p></div>`}`;
}
function practiceView(k){
return `<div class="card" style="margin-top:12px"><h2>Practice Lab</h2><p class="muted">Try each question before revealing the answer.</p>${practice[k].map((q,i)=>`<div class="q"><strong>Q${i+1}. ${esc(q[0])}</strong><div class="opts"><button onclick="showAns('${k.replace(/'/g,"\\'")}-${i}')">Show answer</button></div><div class="answer" id="ans-${k.replace(/[^a-zA-Z0-9]/g,"")}-${i}"><strong>Answer: ${esc(q[1])}</strong><br>${esc(q[2])}</div></div>`).join("")}</div>`;
}
function testView(){
let qs=[
["QA","If a quantity rises 25% and then falls 20%, net change?","0%","Successive multipliers: 1.25×0.8=1."],
["QA","Average of 5 numbers is 24. If one number 14 is removed, new average?","26.5","Total=120; remaining=106; 106/4=26.5."],
["DILR","A:B=2:3 and B:C=4:5. Ratio A:B:C?","8:12:15","Equalise B: 2:3 becomes 8:12; 4:5 becomes 12:15."],
["VARC","An answer choice uses an extreme word not supported by the passage. What should you do?","Eliminate it unless text supports it","Extreme claims need direct support."]
];
return `<div class="hero"><h1>Mixed Test</h1><p>Short diagnostic test. This is original CAT-style practice, not an official past-year paper.</p></div>${qs.map((q,i)=>`<div class="card q"><span class="badge">${q[0]}</span><h3>Q${i+1}. ${q[1]}</h3><button class="toolbar primary" onclick="document.getElementById('t${i}').classList.toggle('show')">Reveal solution</button><div id="t${i}" class="answer"><strong>${q[2]}</strong><br>${q[3]}</div></div>`).join("")}`;
}
function pyqView(){
return `<div class="hero"><h1>PYQ Hub</h1><p>Use this area to organise genuine previous-year questions you obtain from authorised/official sources. The built-in questions are clearly labelled CAT-style so they are not misrepresented as official PYQs.</p></div>
<div class="grid2"><div class="card"><h3>PYQ workflow</h3><ol><li>Choose year and section from your authorised source.</li><li>Tag the question by topic.</li><li>Attempt under a timer.</li><li>Record why you got it wrong.</li></ol></div><div class="card"><h3>What to analyse</h3><ul><li>Concept gap</li><li>Calculation error</li><li>Misread condition</li><li>Bad question selection</li><li>Time pressure</li></ul></div></div>
<div class="card" style="margin-top:12px"><h3>CAT-style practice bank</h3><p class="muted">Open QA/DILR/VARC topics to access the original practice questions included in this version.</p></div>`;
}
function roadmapView(){
let weeks=[
["Phase 0 — Foundation","Weeks 1–2","Basic arithmetic, fractions, percentages, ratios, averages; daily reading; basic LR games."],
["Phase 1 — Core syllabus","Weeks 3–8","Complete arithmetic + algebra basics; start geometry; 3–4 DILR sets/week; daily RC."],
["Phase 2 — CAT application","Weeks 9–14","Mixed QA, tougher DILR, RC inference/tone, timed sectional drills."],
["Phase 3 — Tests & analysis","Weeks 15 onward","Sectionals + mocks; spend at least as much time analysing mistakes as taking tests."]
];
return `<div class="hero"><h1>Zero → CAT Roadmap</h1><p>Use the roadmap as a default. Adjust the pace based on your diagnostic score and available study hours.</p></div>${weeks.map((w,i)=>`<div class="card" style="margin-top:10px"><span class="badge blue">${w[1]}</span><h2>${w[0]}</h2><p>${w[2]}</p><strong>Exit condition:</strong> Can explain the concepts, solve representative questions accurately and identify mistakes.</div>`).join("")}
<div class="card" style="margin-top:12px"><h2>Daily template</h2><ul><li>30–45 min concept learning</li><li>45–60 min QA practice</li><li>30–45 min DILR set</li><li>30–45 min RC/VARC</li><li>15 min error log + revision</li></ul><p class="muted small">The exact split should change as your strengths and weaknesses change.</p></div>`;
}
function mistakesView(){
return `<div class="hero"><h1>Mistake Book</h1><p>Every mistake should become a future strength. This list is saved locally on this phone.</p></div>
${state.mistakes.length?state.mistakes.map((m,i)=>`<div class="card topic"><div><strong>${esc(m)}</strong><div class="muted small">Review the lesson and redo 2–3 questions without help.</div></div><button onclick="state.mistakes.splice(${i},1);save();render('mistakes')">Remove</button></div>`).join(""):`<div class="card"><h3>No mistakes saved yet.</h3><p class="muted">Open a lesson and use “Add to Mistake Book” when a concept causes repeated errors.</p></div>`}`;
}
function render(v="home"){
setNav(v);let el=document.getElementById("view");
if(v==="home")el.innerHTML=dashboard();
else if(v==="QA"||v==="DILR"||v==="VARC")el.innerHTML=sectionView(v);
else if(v==="test")el.innerHTML=testView();
else if(v==="pyq")el.innerHTML=pyqView();
else if(v==="roadmap")el.innerHTML=roadmapView();
else if(v==="mistakes")el.innerHTML=mistakesView();
else if(v.startsWith("lesson:"))el.innerHTML=openLesson(v.slice(7));
window.scrollTo({top:0,behavior:"smooth"});
}
function go(v){render(v)}
function openLesson(k){render("lesson:"+k)}
function toggleDone(k){state.done[k]=!state.done[k];save();render(location.hash?location.hash.slice(1):"home")}
function addToMistakes(k){if(!state.mistakes.includes(k))state.mistakes.push(k);save();alert("Added to Mistake Book.");}
function showAns(key){
let parts=key.split("-");let i=parts.pop();let base=parts.join("-").replace(/[^a-zA-Z0-9]/g,"");let e=document.getElementById("ans-"+base+"-"+i);if(e)e.classList.add("show");
}
document.getElementById("nav").innerHTML=[
["home","🏠 Dashboard"],["QA","📐 QA"],["DILR","🧩 DILR"],["VARC","📖 VARC"],["test","🧪 Test"],["pyq","📜 PYQ"],["roadmap","🗺️ Roadmap"],["mistakes","⚠️ Mistakes"]
].map(x=>`<button data-v="${x[0]}" onclick="go('${x[0]}')">${x[1]}</button>`).join("");
render("home");
</script>
</body>
</html>
