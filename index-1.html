<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CAT MASTER — Zero to CAT</title><style>
:root{--bg:#f5f7fb;--s:#fff;--ink:#172033;--muted:#667085;--line:#e5e7eb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;line-height:1.55}button,input,select{font:inherit}button{cursor:pointer}header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line)}.top{max-width:1100px;margin:auto;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:900;font-size:21px}.brand span{font-weight:500}.pill{background:#111827;color:#fff;border:0;border-radius:999px;padding:10px 16px}.wrap{max-width:1100px;margin:auto;padding:18px 14px 80px}.hero{background:linear-gradient(135deg,#111827,#2b3953);color:#fff;border-radius:20px;padding:24px}.hero h1{margin:0 0 5px;font-size:29px}.hero p{margin:0;color:#d9dfeb}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:16px}.stat{background:#ffffff16;border:1px solid #ffffff20;border-radius:12px;padding:10px}.stat b{display:block;font-size:19px}.toolbar{display:flex;gap:9px;margin:18px 0;flex-wrap:wrap}.search{flex:1;min-width:220px;padding:12px 14px;border:1px solid var(--line);border-radius:12px}.filter{padding:11px;border:1px solid var(--line);border-radius:12px;background:#fff}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}.card,.lesson{background:var(--s);border:1px solid var(--line);border-radius:17px;padding:17px;box-shadow:0 2px 9px #0f172a08}.card h3{margin:0}.card p{color:var(--muted);font-size:14px;margin:4px 0}.tags{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.tag{background:#eef2ff;border-radius:99px;padding:4px 8px;font-size:12px}.progress{height:7px;background:#e5e7eb;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:#111827}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 12px}.primary{background:#111827;color:#fff;border-color:#111827}.good{background:#ecfdf3;color:#166534}.hidden{display:none!important}.lesson{margin-top:18px}.lesson h2{margin-top:12px}.lesson h3{margin-top:22px}.formula{background:#f8fafc;border-left:4px solid #111827;padding:10px 13px;border-radius:7px}.example{background:#fffbeb;border:1px solid #fde68a;padding:12px;border-radius:10px;margin:8px 0}.note{background:#eff6ff;color:#1e40af;padding:11px 13px;border-radius:9px}.muted{color:var(--muted)}.q{border-top:1px solid var(--line);padding:15px 0}.q:first-child{border-top:0}.opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:8px;padding:10px;margin:6px 0}.opt.correct{background:#f0fdf4;border-color:#86efac}.opt.wrong{background:#fef2f2;border-color:#fca5a5}footer{position:fixed;bottom:0;left:0;right:0;background:#111827;color:#fff;text-align:center;padding:9px;font-size:13px}@media(max-width:700px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.hero h1{font-size:25px}}
</style></head><body><header><div class="top"><div class="brand">🎓 CAT <span>MASTER</span></div><button class="pill" onclick="home()">ZERO → CAT</button></div></header><main class="wrap"><section class="hero"><h1>Quantitative Aptitude</h1><p>Zero se CAT-level tak — Learn → Practice → PYQ-style → Test → Analyse</p><div class="stats"><div class="stat"><b id="done">0</b>Topics completed</div><div class="stat"><b>8</b>Core QA topics</div><div class="stat"><b id="last">0%</b>Last score</div><div class="stat"><b>Free</b>Study material</div></div></section><div id="homeView"><div class="toolbar"><input id="search" class="search" placeholder="Search topics, e.g. remainder" oninput="render()"><select id="level" class="filter" onchange="render()"><option value="all">All levels</option><option value="beginner">Beginner</option><option value="cat">CAT level</option></select></div><h2>QA Topic Checklist</h2><div id="grid" class="grid"></div></div><section id="study" class="lesson hidden"></section></main><footer>CAT MASTER • Learn → Practice → PYQ-style → Test → Analyse</footer>
<script>
const T=[
{id:'number',n:'Number System',l:'beginner',d:'Divisibility, factors, remainders, unit digit, HCF/LCM.',tags:['Foundation','High value'],c:[['Divisibility rules','2: last digit even. 3/9: digit sum divisible by 3/9. 4: last two digits. 5: 0 or 5. 8: last three digits. 11: alternating digit-sum difference divisible by 11.'],['Factors','If N=p^a×q^b×r^c, number of positive factors=(a+1)(b+1)(c+1).'],['Remainders','If a=bq+r, then 0≤r<b. Reduce numbers modulo the divisor before operations.'],['HCF & LCM','For two positive integers a,b: a×b=HCF(a,b)×LCM(a,b).'],['Unit digit','Power cycles repeat. For 2: 2,4,8,6; 3: 3,9,7,1; 7: 7,9,3,1.']],e:['360=2^3×3^2×5, so factors=(4)(3)(2)=24.','58 divided by 7 leaves 2.','7^43: 43 mod 4=3, so unit digit is 3.'],q:[['Factors of 72?','12',['10','12','14','16'],'72=2^3×3^2, so 4×3=12.'],['Remainder of 58÷7?','2',['1','2','3','4'],'58=7×8+2.'],['Unit digit of 3^25?','3',['1','3','7','9'],'Cycle 3,9,7,1; 25 mod 4=1.']]},
{id:'percent',n:'Percentages',l:'beginner',d:'Percentage change, successive change and reverse percentage.',tags:['Foundation','Arithmetic'],c:[['Basics','x%=x/100. Percentage change=(change/original)×100.'],['Successive change','Use multipliers: (1+a/100)(1+b/100).'],['Reverse percentage','If final=F after p% increase, original=F/(1+p/100).'],['Shortcut','Increase x% then decrease x% gives net decrease x²/100%.'],['Ratio link','A is 25% more than B means A:B=5:4; B is 20% less than A.']],e:['20% up then 20% down: 1.2×0.8=.96, so 4% decrease.','₹36,000 after 20% rise → original ₹30,000.'],q:[['25% rise then 20% fall: net?','0%',['0%','5% increase','5% decrease','10% decrease'],'1.25×.8=1.'],['40% of x=80. x?','200',['120','160','200','240'],'x=80/.4=200.'],['A is 25% more than B. B is how much less than A?','20%',['15%','20%','25%','33⅓%'],'25/125=20%.']]},
{id:'ratio',n:'Ratio & Proportion',l:'beginner',d:'Ratios, proportions, distribution, variation and partnership.',tags:['Foundation','Arithmetic'],c:[['Ratio','A:B=m:n means A=mk and B=nk.'],['Proportion','a:b=c:d implies ad=bc.'],['Distribution','For 2:3:5, total parts=10.'],['Variation','Direct: y∝x. Inverse: y∝1/x.'],['Partnership','Profit share is proportional to capital×time.']],e:['₹2400 in 2:3:5 → ₹480, ₹720, ₹1200.','A:B=3:5 and B:C=10:7 → A:B:C=6:10:7.'],q:[['₹900 in ratio 2:3. Larger share?','₹540',['₹300','₹450','₹540','₹600'],'3/5×900=540.'],['x:y=4:7 and y:z=14:9. Ratio?','8:14:9',['4:7:9','8:14:9','4:14:9','8:7:9'],'Make y common: 4:7 → 8:14.']]},
{id:'avg',n:'Averages',l:'beginner',d:'Mean, weighted average, replacement and average speed.',tags:['Foundation','Arithmetic'],c:[['Mean','Average=sum/count; sum=average×count.'],['Replacement','If one value changes by d among n values, average changes by d/n.'],['Weighted average','Combined average=(n1a1+n2a2)/(n1+n2).'],['Average speed','Total distance/total time; do not simply average speeds unless conditions justify it.']],e:['Average 8 numbers=15 → sum=120.','Equal distances at 40 and 60 km/h → average speed 48 km/h.'],q:[['Average of 10 numbers is 18. Sum?','180',['28','90','180','360'],'18×10=180.'],['20 people average 30; one new person has 50. New average?','30.95',['30','30.95','35','40'],'650/21≈30.95.']]},
{id:'pl',n:'Profit & Loss',l:'beginner',d:'CP, SP, MP, profit/loss and discounts.',tags:['Foundation','Arithmetic'],c:[['Terms','CP=cost price, SP=selling price, MP=marked price.'],['Profit/loss','Profit=SP−CP; Profit%=Profit/CP×100.'],['Discount','Discount=MP−SP; Discount%=Discount/MP×100.'],['Successive discounts','Net multiplier=(1−d1/100)(1−d2/100).']],e:['CP ₹800, SP ₹920 → 15% profit.','20% then 10% discount → effective discount 28%.'],q:[['CP ₹500, SP ₹575. Profit %?','15%',['10%','12.5%','15%','20%'],'75/500×100=15%.'],['20% and 25% successive discounts = single?','40%',['35%','40%','45%','50%'],'1−.8×.75=.40.']]},
{id:'si',n:'Simple & Compound Interest',l:'beginner',d:'SI, CI, growth factors and comparison.',tags:['Formula','Arithmetic'],c:[['Simple Interest','SI=P×R×T/100.'],['Compound Interest','Amount=P(1+R/100)^T; CI=Amount−P.'],['Growth/decay','Repeated percentage change uses multiplication of factors.'],['Two-year difference','For annual compounding, CI−SI=P(R/100)^2 for 2 years.']],e:['₹10,000 at 8% SI for 2 years → SI ₹1600.','₹10,000 at 10% CI for 2 years → amount ₹12,100.'],q:[['SI on ₹5000 at 10% for 3 years?','₹1500',['₹500','₹1000','₹1500','₹2000'],'5000×10×3/100.'],['₹10,000 at 10% CI for 2 years. Amount?','₹12,100',['₹11,000','₹12,000','₹12,100','₹12,200'],'10000×1.1².']]},
{id:'mix',n:'Mixtures & Alligation',l:'cat',d:'Weighted mixtures, alligation and replacement.',tags:['CAT level','Arithmetic'],c:[['Weighted average','Mixture concentration is a weighted average.'],['Alligation','Cheaper:dearer=(dearer−mean):(mean−cheaper).'],['Replacement','After removing x from V repeatedly, original fraction left=(1−x/V)^n.']],e:['20% and 50% to make 30% → ratio 2:1.','100 L: remove 20 L → 80 L original remains.'],q:[['20% and 50% make 30%. Ratio?','2:1',['1:1','2:1','3:2','1:2'],'Alligation:20:10=2:1.'],['40 L at 25% acid. Acid quantity?','10 L',['5 L','8 L','10 L','15 L'],'25% of 40=10.']]},
{id:'work',n:'Time, Work & Pipes',l:'cat',d:'Work rates, efficiency, combined work and pipes.',tags:['CAT level','Arithmetic'],c:[['Work rate','If A finishes in x days, one-day work=1/x.'],['Combined work','Rates add: 1/x+1/y; time is reciprocal.'],['Efficiency','Efficiency is proportional to work/time. Twice efficiency means half time.'],['Pipes','Filling rates positive; emptying rates negative.']],e:['A 12 days, B 18 days → combined rate 5/36 → 7.2 days.','A 50% more efficient than B → efficiency 3:2; time 2:3.'],q:[['A 10 days, B 15 days. Together?','6 days',['5','6','7.5','8'],'1/10+1/15=1/6.'],['A twice as efficient as B; B=18 days. A?','9 days',['6','9','12','36'],'Double efficiency means half time.']]}
];
let done=JSON.parse(localStorage.cat_done||'[]'),score=0,current=null;
function render(){let s=document.getElementById('search').value.toLowerCase(),lv=document.getElementById('level').value,g=document.getElementById('grid');g.innerHTML='';T.filter(t=>(lv==='all'||t.l===lv)&&(!s||(t.n+' '+t.d+' '+t.tags).toLowerCase().includes(s))).forEach(t=>{let x=done.includes(t.id);g.innerHTML+=`<article class="card"><h3>${t.n} ${x?'✓':''}</h3><p>${t.d}</p><div class="tags">${t.tags.map(a=>`<span class="tag">${a}</span>`).join('')}</div><div class="progress"><i style="width:${x?100:0}%"></i></div><div class="actions"><button class="btn primary" onclick="learn('${t.id}')">📚 Learn</button><button class="btn" onclick="practice('${t.id}')">✍️ Practice</button><button class="btn good" onclick="complete('${t.id}')">${x?'✓ Completed':'Mark complete'}</button></div></article>`});document.getElementById('done').textContent=done.length}
function learn(id){current=T.find(t=>t.id===id);document.getElementById('homeView').classList.add('hidden');let s=document.getElementById('study');s.classList.remove('hidden');s.innerHTML=`<button class="btn" onclick="home()">← All topics</button><h2>📚 ${current.n}</h2><p class="muted">${current.d}</p><div class="note">Method: concept → formula → solved example → practice. These notes are original study material.</div><h3>Lesson</h3>${current.c.map((x,i)=>`<div><h3>${i+1}. ${x[0]}</h3><p>${x[1]}</p></div>`).join('')}<h3>💡 Solved examples</h3>${current.e.map(x=>`<div class="example">${x}</div>`).join('')}<h3>✍️ Practice</h3><button class="btn primary" onclick="practice('${id}')">Start practice</button>`;scrollTo(0,0)}
function practice(id){current=T.find(t=>t.id===id);score=0;document.getElementById('homeView').classList.add('hidden');let s=document.getElementById('study');s.classList.remove('hidden');s.innerHTML=`<button class="btn" onclick="learn('${id}')">← Lesson</button><h2>✍️ Practice — ${current.n}</h2><p class="muted">Original CAT-style questions; not reproduced official CAT questions.</p><div id="qs">${current.q.map((q,i)=>`<div class="q"><b>${i+1}. ${q[0]}</b><div>${q[2].map(o=>`<button class="opt" onclick="ans(this,'${encodeURIComponent(q[1])}',${i})">${o}</button>`).join('')}</div><small id="ex${i}" class="muted"></small></div>`).join('')}</div><button class="btn primary" onclick="result()">Finish & Analyse</button><div id="res"></div>`;scrollTo(0,0)}
function ans(b,a,i){let correct=decodeURIComponent(a);b.parentElement.querySelectorAll('button').forEach(x=>x.disabled=true);if(b.textContent.trim()===correct){b.classList.add('correct');score++}else{b.classList.add('wrong');b.parentElement.querySelectorAll('button').forEach(x=>{if(x.textContent.trim()===correct)x.classList.add('correct')})}document.getElementById('ex'+i).textContent=current.q[i][3]}
function result(){let p=Math.round(score/current.q.length*100);localStorage.cat_last=p;document.getElementById('last').textContent=p+'%';document.getElementById('res').innerHTML=`<div class="lesson"><h3>📊 Analysis</h3><b>${score}/${current.q.length} correct (${p}%)</b><div class="progress"><i style="width:${p}%"></i></div><p>${p>=80?'Strong — move to mixed CAT-level sets.':p>=50?'Good start — revise formulas and retry.':'Relearn the lesson and retry before moving ahead.'}</p></div>`}
function complete(id){if(!done.includes(id)){done.push(id);localStorage.cat_done=JSON.stringify(done)}render()}function home(){document.getElementById('study').classList.add('hidden');document.getElementById('homeView').classList.remove('hidden');render();scrollTo(0,0)}
document.getElementById('last').textContent=(localStorage.cat_last||0)+'%';render();
</script></body></html>
